name: Deployment to production
concurrency: production
on:
   workflow_dispatch:
    inputs:
      tags:
        description: 'Do you really want to update the production instance'
        required: false
        type: boolean
      image_sha:
        description: 'Image SHA ID, Optional '
        type: string
        required: false
env:
  KUBECONFIG: .kube/config
  KUBECONFIG_FILE: ${{ secrets.KUBECONFIG_PROD }}
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - run: |
        mkdir -p .kube
        echo "${{ env.KUBECONFIG_FILE }}" > $KUBECONFIG
    - uses: stefanprodan/kube-tools@v1
      with:
        helmv3: 3.12.0
        command: |
          helmv3 repo add mda-deployment https://nfdi4health.github.io/mda-deployment/
          helmv3 repo update
          helmv3 upgrade mda-prod  \
          --install \
          --namespace='nfdi4health-mda' \
          --set-json='images.backend="ghcr.io/nfdi4health/metadata-annotation-workbench/backend:5017b0725601b0c70a71dbc4ecd9e18961b770a7"' \
          --set-json='images.ui="ghcr.io/nfdi4health/metadata-annotation-workbench/frontend:080be46da995e7ae1a2b1bc6d0f393f6c7a527d9"'  \
          --set-json='images.prediction="ghcr.io/nfdi4health/maelstrom-classification/backend:77cd72f127614f6f68aa91278224b48b2a7bded4"'  \
          --set-json='ingress.dns="mda.nfdi4health.de"'  \
          --set-json='ingress.enableSSL="true"'  \
          --set-json='ingress.certIssuer="letsencrypt-prod"'  \
          mda-deployment/metadata-annotation
